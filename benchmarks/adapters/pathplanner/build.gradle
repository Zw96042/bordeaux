plugins {
    id 'java'
    id 'application'
    id 'edu.wpi.first.GradleRIO' version '2026.1.1'
}

repositories {
    mavenCentral()
    maven { url = uri('https://frcmaven.wpi.edu/artifactory/release') }
    maven { url = uri('https://3015rangerrobotics.github.io/pathplannerlib/repo') }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

dependencies {
    implementation wpi.java.deps.wpilib()
    implementation 'com.pathplanner.lib:PathplannerLib-java:2026.1.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
}

application {
    mainClass = 'dev.bordeaux.benchmark.PathPlannerHarness'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    dependsOn extractReleaseNative
    systemProperty 'java.library.path', layout.buildDirectory.dir('jni/release').get().asFile.absolutePath
}
