<!DOCTYPE html>

  <script src="assets/ui-primitives.js"></script>
  <script src="assets/field-view.js"></script>
  <script src="assets/context-inspector.js"></script>
  <script src="assets/robot-page.js"></script>
  <script src="assets/panels.js"></script>
  <script src="assets/routine-panel.js"></script>
  <script src="assets/routine-inspector.js"></script>
