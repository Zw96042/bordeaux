<script type="application/json" id="thelab-findings">[
  {"key":"p0-persistence-disconnected","title":"Shipped UI cannot save or reopen projects","type":"bug","severity":"critical","body":"Electron loads public/legacy/index.html, but File menu commands are only handled by the unused src/renderer app. The shipped renderer has no open/save/menu-command integration and no unsaved-close guard, so project work is lost on exit. Unify the renderer and add Electron workflow tests for New/Open/Save/Save As/close."},
  {"key":"p1-routine-deploy-contract","title":"Auto Deploy does not deploy the authored routine","type":"bug","severity":"high","body":"The Auto toolbar labels the path-only .bdx export action Deploy, but BdxExport has no routine field and the edited routine is separate from project state. Define the intended contract: version and extend .bdx, emit a separate routine artifact, or relabel/remove Deploy. Persist routine state and replace numeric path references with stable IDs."},
  {"key":"p1-nonfinite-export","title":"Malformed geometry exports non-finite samples as JSON null","type":"bug","severity":"high","body":"Control-handle coordinates and several nested numeric fields are not validated. A verified probe passed validation, generated 57 bad samples, and serialized 170 null values. Fully validate nested numeric fields and assert finite planner output before writing."},
  {"key":"p1-diagnostics-bypassed","title":"Export writes trajectories that preview marks unsafe","type":"bug","severity":"high","body":"IPC export calls buildBdxExport directly, while high-severity planner diagnostics only make previewBdxExport fail. A path with radius about 0.12 m was written by build while preview returned ok:false. Make export enforce the same blocking policy and show an actionable confirmation/error flow."},
  {"key":"p1-marker-retiming","title":"Optimized planner computes incorrect marker timestamps","type":"bug","severity":"high","body":"Optimized retiming is nonuniform, but marker times are multiplied by one global duration ratio. A focused probe showed a 0.131 second error. Re-interpolate each marker against the final retimed samples and add localized-slowdown regression tests."},
  {"key":"p1-canonical-renderer","title":"Choose one canonical typed renderer","type":"chore","severity":"high","body":"Electron ships generated public/legacy assets while src/renderer is typechecked but unused. Build and tests can pass without validating the product users run. Make src/renderer canonical or explicitly source and test the legacy renderer; ensure build produces the exact loaded artifact."},
  {"key":"p1-electron-security","title":"Harden Electron IPC and upgrade vulnerable Electron","type":"bug","severity":"high","body":"Electron 37.10.3 has high-severity advisories. The renderer sandbox is disabled, no CSP/navigation/window-open policy is present, and preload accepts arbitrary file paths that main reads/writes without sender checks. Upgrade Electron and convert the bridge to intent-based, main-owned file operations."},
  {"key":"p2-validator-boundary","title":"Make project validation total at every boundary","type":"bug","severity":"medium","body":"validateProject throws on paths strings, null path entries, and malformed waypoint containers. Guard every container, validate schema/planner enums, and reuse a never-throwing validator at open/save/export with malformed-input regression tests."},
  {"key":"p2-atomic-save","title":"Validate and atomically replace project files","type":"bug","severity":"medium","body":"Save bypasses validation and truncates the destination in place. Validate immediately in main, serialize saves per target, write a sibling temporary file, and atomically rename it only after a complete write."},
  {"key":"p1-accessibility-keyboard","title":"Make editor structure and canvas actions keyboard-operable","type":"bug","severity":"high","body":"Outline rows/disclosures use non-focusable click semantics and the SVG field is pointer-centric. Use native buttons with Enter/Space behavior, managed focus and expanded state, and provide an outline-based keyboard route for every canvas operation."},
  {"key":"p2-accessibility-names","title":"Add programmatic control names, states, and landmarks","type":"bug","severity":"medium","body":"Live accessibility inspection found 11 of 50 exposed controls unnamed and no main/nav landmarks. Bind numeric labels and units, name icon-only controls/sliders, expose selected/expanded state, and add page landmarks/headings."},
  {"key":"p2-focus-visible","title":"Restore visible keyboard focus across controls","type":"bug","severity":"medium","body":"Many components only style hover/active while inputs and ranges suppress native outlines. Add a global high-contrast :focus-visible ring with component-specific offsets and verify the complete tab order."},
  {"key":"p2-contrast","title":"Raise low-contrast text and active-control colors","type":"bug","severity":"medium","body":"The shipped theme uses #5f656e on dark surfaces at about 3.1-3.35:1 for 9.5-12px text and the default active accent at about 3.7-3.95:1. Both miss WCAG 1.4.3 for normal text. Adjust tokens and test every theme."},
  {"key":"p2-destructive-ux","title":"Protect destructive path and routine actions","type":"bug","severity":"medium","body":"Path deletion is immediate, outside the per-path undo history, and has no confirmation or recovery. Routine deletion is likewise immediate. Add undoable deletion or a clear confirmation for high-value objects, then preserve selection and references predictably."},
  {"key":"p2-verification-gap","title":"Add shipped-app tests and CI","type":"chore","severity":"medium","body":"The 13 tests cover shared export math; the only legacy UI check asserts source strings. There are no IPC, UI, malformed-file, unsaved-close, packaging, or accessibility tests and no CI. Add focused unit regressions plus one Electron smoke flow and run test/typecheck/build/audit in CI."}
]</script>
