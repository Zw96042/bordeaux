<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Bordeaux — Cultivated engineering</title>
  <desc id="desc">A warm-black social preview with neutral typography and a rich Bordeaux-red wine glass mark.</desc>
