name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run certify:field
      - run: npm run test:java
      - run: npm run build
      - run: npm run test:java-integration:built
      - run: npm audit --audit-level=high
      - name: Configure Electron sandbox
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: xvfb-run -a npm run test:smoke:built
      - name: Verify library and routine UI
        run: xvfb-run -a node scripts/verify-library-ui.mjs
        env:
          BORDEAUX_LIBRARY_UI_OUTPUT: .ui-artifacts/library
      - name: Verify optimizer UI
        if: success() || failure()
        run: xvfb-run -a node scripts/verify-optimizer-ui.mjs
        env:
          BORDEAUX_OPTIMIZER_UI_OUTPUT: .ui-artifacts/optimizer
      - name: Verify mocked robot push UI
        if: success() || failure()
        run: xvfb-run -a node scripts/verify-robot-push-ui.mjs
        env:
          BORDEAUX_PUSH_UI_OUTPUT: .ui-artifacts/push
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-verification
          include-hidden-files: true
          path: |
            .ui-artifacts/**/*.png
            .ui-artifacts/**/result*.json
            .ui-artifacts/**/failure-dom.txt
          if-no-files-found: warn
