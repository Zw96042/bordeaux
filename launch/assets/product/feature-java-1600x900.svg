" font-size="19">intake::stop, intake);</text><text x="770" y="534" fill="#c8cae9" font-family="monospace" font-size="19">}</text><path d="M770 607h650" stroke="#2b292e"/><circle cx="786" cy="668" r="11" fill="#77c795"/><text x="814" y="675" fill="#f5efe6" font-family="Arial" font-size="20" font-weight="600">Catalog validated before export</text></svg>