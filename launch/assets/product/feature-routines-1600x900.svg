th="3"/><rect x="770" y="426" width="650" height="116" rx="14" fill="#1b1b20" stroke="#2b292e"/><rect x="794" y="450" width="68" height="68" rx="12" fill="#77c795" fill-opacity=".17"/><text x="828" y="494" text-anchor="middle" fill="#77c795" font-family="Arial" font-size="26">◇</text><text x="890" y="469" fill="#aaa4a0" font-family="monospace" font-size="13" letter-spacing="2">DECISION</text><text x="890" y="504" fill="#f5efe6" font-family="Arial" font-size="23" font-weight="600">Game piece present?</text><rect x="770" y="570" width="310" height="64" rx="10" fill="#121216"/><rect x="1110" y="570" width="310" height="64" rx="10" fill="#121216"/><text x="797" y="610" fill="#aaa4a0" font-family="Arial" font-size="17">Yes → Collect center</text><text x="1137" y="610" fill="#aaa4a0" font-family="Arial" font-size="17">No → Park safely</text></svg>